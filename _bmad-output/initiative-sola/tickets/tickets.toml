# Initiativet Sola: en epik per steg i byggordningen (docs/exempelapp.md). Tabellordning = byggordning.
# R12 (utbrytning) delas av alla epiker: var och en bryter ut det som den skriver för andra gången.

[[epic]]
id = 1
slug = "epic-foundation"
title = "Grund: sola dev, server och appens skal"
description = "node example/server och sola dev startar exemplet: startsidans skal (index.html med import map för #sola, app.js, api.js, style.css) visas under strikt CSP, djuplänkar svarar med index.html, /api/* proxas till servern med data i minnet inklusive cookies och strömmande SSE, sidan laddas om vid ändring och CSS byts utan omladdning; node --test kör testerna för sola dev och example/server; sola/sola.js finns och nås via #sola. Epik 2 bygger sina vyer på skalet, epik 3 på cookie-proxyn och epik 6 på SSE-proxyn."
covers = ["R1", "R2", "R3", "R12", "R13"]

[[epic]]
id = 2
slug = "epic-providers"
title = "Utförare och tider: startsidan och /providers/:id"
description = "Vem som helst ser utförare med tjänster på / och en utförares tjänster och lediga tider på /providers/:id, via api.js och den första routingen i app.js; det som skrivits två gånger är utbrutet till #sola. Epik 3 och 4 bygger vidare på routern och på /providers/:id."
covers = ["R4", "R12"]
after = [{ epic = 1, needs = "sola dev med proxy och djuplänkar, example/server med data i minnet, app.js-, api.js- och index.html-skalet med import map för #sola" }]

[[epic]]
id = 3
slug = "epic-login"
title = "Inloggning: /login, sessionscookie och currentUser"
description = "En användare loggar in och ut via /login, servern sätter sessionscookien enligt AD-7 och svarar 401 utan session, session.js äger currentUser och sidhuvudet visar vem som är inloggad. För R5 levererar epiken in- och utloggning och cookien, för R6 serverns 401. Guards och 403 kopplas på i epik 4 och 5, där de första skyddade vyerna och rollbundna anropen finns."
covers = ["R5", "R6", "R12"]
after = [{ epic = 2, needs = "routern i app.js som /login läggs i" }]

[[epic]]
id = 4
slug = "epic-customer-flow"
title = "Brukarens flöde: guards, boka, mina bokningar, avboka"
description = "En inloggad brukare bokar en ledig tid från /providers/:id via /book/:slotId, ser kommande och tidigare bokningar på /my-bookings och avbokar; en upptagen tid ger slot-taken och en avbokad tid går att boka igen. Första storyn inför guards i app.js på /book/:slotId och /my-bookings och provar omdirigeringen till /login?next= och tillbaka (epikens del av R5). För R6 levererar epiken guards, brukarens routes och 403 på brukarens API-anrop; för R8 regeln om en aktiv bokning och att en avbokad tid kan bokas igen. Epik 5 bekräftar och avvisar de bokningar som skapas här."
covers = ["R5", "R6", "R7", "R8", "R12"]
after = [
  { epic = 2, needs = "/providers/:id med lediga tider att boka från" },
  { epic = 3, needs = "session, currentUser och 401 från servern" },
]

[[epic]]
id = 5
slug = "epic-provider-flow"
title = "Utförarens flöde: schema, tider, bekräfta"
description = "En inloggad utförare lägger ut och tar bort tider på /slots, ser veckoschemat på /schedule och bekräftar eller avvisar på /bookings/:id; vyerna laddas med import() bara för utförare. För R6 levererar epiken rollguarden för utförare och 403 på utförarens API-anrop; för R8 att en avvisad tid kan bokas igen. Epik 6 gör /schedule live."
covers = ["R6", "R8", "R9", "R10", "R12"]
after = [
  { epic = 3, needs = "session och currentUser med roll" },
  { epic = 4, needs = "guards i app.js samt bokningar i servern och api.js att bekräfta och avvisa" },
]

[[epic]]
id = 6
slug = "epic-live"
title = "Live: vyerna uppdateras via Server-Sent Events"
description = "GET /api/events skickar booking.changed och slot.changed enligt AD-17 genom sola dev:s proxy; när en brukare bokar eller avbokar, eller en utförare ändrar en tid eller bokning, hämtar /schedule, /bookings/:id, /slots, /providers/:id och /my-bookings om utan omladdning, och lyssnarna städas när vyn lämnas."
covers = ["R11", "R12"]
after = [
  { epic = 1, needs = "proxyn i sola dev som strömmar SSE (AD-5)" },
  { epic = 5, needs = "/schedule och övriga vyer som ska hämta om vid händelse" },
]

[[epic]]
id = 7
slug = "epic-release"
title = "Första release: tester, sola test, sola build, sola update och distribution"
description = "Exporterna i sola.js har node:test-tester och sola test kör alla tester; sola build ger en produktionsversion utan bundling; sola.js är släppt som oföränderlig GitHub Release med attestering och nåbar via jsDelivr; sola update hämtar och verifierar en release; exempelappen körs från vendor/sola-x.y.z.js och uppgraderas med en rad i import map."
covers = ["R14", "R15", "R16", "R17"]
after = [{ epic = 6, needs = "en färdig app vars utbrytningar har gett sola.js dess API" }]
